services:
  db:
    image: postgres:16-alpine
    container_name: thesis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: thesis
      POSTGRES_PASSWORD: thesis
      POSTGRES_DB: thesis
    ports:
      - "5433:5432"
    volumes:
      - thesis-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thesis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  thesis-pgdata:
